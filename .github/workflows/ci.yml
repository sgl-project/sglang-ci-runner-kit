name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing here needs a secret or write access. Under pull_request, fork PRs get
# a read-only token and no secrets; keep it that way.
permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the check reads the base branch's history
          persist-credentials: false
      - name: Install
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q -r requirements-dev.txt
      - name: Check keys and labels
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # HEAD is GitHub's merge commit; its first parent is the base it was
            # merged onto. Run the checker as it is on the base, so a PR can't
            # weaken the check that judges it.
            base=$(git rev-parse HEAD^1)
            if ! git show "$base:scripts/check_kit.py" > /tmp/check_kit.py; then
              # Only before the checker first lands on main; a PR can't cause this.
              echo "::notice::base has no checker yet; using the PR's own"
              cp scripts/check_kit.py /tmp/check_kit.py
            fi
            /tmp/venv/bin/python /tmp/check_kit.py --base "$base" --author "$PR_AUTHOR"
          else
            /tmp/venv/bin/python scripts/check_kit.py
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q -r requirements-dev.txt
      - name: Tests
        run: /tmp/venv/bin/python -m pytest -q
      - name: Shellcheck
        run: shellcheck client/runner_loop.sh
